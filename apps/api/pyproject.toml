[project]
name = "realvalue-api"
version = "0.1.0"
description = "Defensible prototype residential valuation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn[standard]==0.40.0",
  "httpx==0.28.1",
  "pydantic-settings==2.12.0",
  "SQLAlchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "greenlet>=3.1.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
